<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ quadro_name }} - Quadri Viventi</title>
    <link rel="stylesheet" href="/static/css/quadro.css">
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">
            <h2>🎨 Caricamento Quadro</h2>
            <p>Preparazione visualizzazione di "{{ quadro_name }}"...</p>
        </div>
    </div>

    <!-- Error Screen -->
    <div class="error-screen hidden" id="error-screen">
        <div class="error-content">
            <h2>⚠️ Errore</h2>
            <p id="error-message">Si è verificato un errore durante il caricamento del quadro.</p>
            <div style="margin-top: 30px;">
                <button onclick="location.reload()" class="btn btn-primary">
                    🔄 Ricarica
                </button>
                <button onclick="window.history.back()" class="btn btn-secondary">
                    ← Torna Indietro
                </button>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="quadro-container">
        <canvas id="quadro-canvas" width="1920" height="1080"></canvas>
        
        <!-- Overlay with information -->
        <div class="quadro-overlay" id="quadro-overlay">
            <!-- Quadro Info -->
            <div class="quadro-info">
                <div class="quadro-title" id="quadro-title">{{ quadro_name }}</div>
                <div class="quadro-subtitle">
                    Dispositivo: <span id="device-name">{{ device_id or 'Non specificato' }}</span>
                </div>
            </div>

            <!-- Sensor Values -->
            <div class="sensor-values">
                <div class="sensor-value" data-sensor="temperature">
                    <span class="sensor-icon">🌡️</span>
                    <span class="sensor-label">Temperatura:</span>
                    <span class="sensor-display" id="temperature-value">--°C</span>
                </div>
                <div class="sensor-value" data-sensor="humidity">
                    <span class="sensor-icon">💧</span>
                    <span class="sensor-label">Umidità:</span>
                    <span class="sensor-display" id="humidity-value">--%</span>
                </div>
                <div class="sensor-value" data-sensor="light">
                    <span class="sensor-icon">💡</span>
                    <span class="sensor-label">Luce:</span>
                    <span class="sensor-display" id="light-value">--</span>
                </div>
                <div class="sensor-value" data-sensor="audio">
                    <span class="sensor-icon">🔊</span>
                    <span class="sensor-label">Audio:</span>
                    <span class="sensor-display" id="audio-value">--</span>
                </div>
            </div>

            <!-- Connection Status -->
            <div class="connection-status">
                <div class="status-indicator connecting" id="status-indicator"></div>
                <div class="status-text" id="status-text">Connessione...</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="quadro-controls visible" id="quadro-controls">
            <button class="control-btn" onclick="toggleOverlay()" title="Mostra/Nascondi Info">
                👁️
            </button>
            <button class="control-btn" onclick="toggleFullscreen()" title="Schermo Intero">
                ⛶
            </button>
            <button class="control-btn" onclick="goBack()" title="Torna Indietro">
                ←
            </button>
        </div>
    </div>

    <!-- JavaScript Configuration -->
    <script>
        // Configurazione passata dal server Python
        window.QUADRO_CONFIG = {
            quadro_id: '{{ quadro_id }}',
            quadro_name: '{{ quadro_name }}',
            device_id: '{{ device_id }}',
            template: '{{ template }}',
            sensors_config: '{{ sensors_config | safe }}',
        };
    </script>
    
    <script src="/static/js/quadro.js"></script>
</body>
</html>
